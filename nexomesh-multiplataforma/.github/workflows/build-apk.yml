name: Compilar NexoMesh APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK y NDK
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias e instalar SDK 35 + NDK 26
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Configurar Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Compilar núcleo Rust JNI (arm64-v8a)
        working-directory: rust-core
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK Debug
        run: gradle assembleDebug --no-daemon

      - name: Subir APK compilado
        uses: actions/upload-artifact@v6
        with:
          name: nexomesh-vpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
