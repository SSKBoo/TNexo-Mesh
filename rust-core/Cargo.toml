[package]
name = "nexomesh_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
snow = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
blake2 = "0.10"
anyhow = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rustls = "0.23"
webpki-roots = "0.26"

[[bin]]
name = "nexomesh-cli"
path = "src/bin/nexomesh-cli.rs"
