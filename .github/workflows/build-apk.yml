name: Compilar NexoMesh APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmdline-tools;latest'
    
  

      - name: Instalar NDK 26 y cargo-ndk
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Configurar Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk
  

      - name: Compilar núcleo Rust JNI (arm64-v8a)
        working-directory: rust-core
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: gradle assembleDebug --no-daemon

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: nexomesh-vpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
